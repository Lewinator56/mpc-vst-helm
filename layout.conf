# Helm VST - MPC Touch UI Layout
# Clean, modern layout with OpenSans typography and Dexed-style bank/patch browsing.

[tab MAIN]
frame x=10 y=92 w=1258 h=240 title="PRESET BROWSER"
stepper cx=230 cy=212 w=380 h=54 label="CATEGORY" key=category get=folder_name
stepper cx=640 cy=212 w=400 h=54 label="PATCH" key=preset get=patch_name
readout cx=1040 cy=212 w=360 h=54 label="AUTHOR" key=author
frame x=10 y=340 w=1258 h=368 title="MASTER & VOICE"
knob cx=120 cy=500 r=40 label="VOLUME" key=volume
knob cx=300 cy=500 r=40 label="POLYPHONY" key=polyphony
toggle cx=480 cy=500 label="LEGATO" key=legato
knob cx=660 cy=500 r=40 label="PORTAMENTO" key=portamento
enum_v cx=840 cy=490 label="GLIDE MODE" key=portamento_type options="ALWAYS,LEGATO,OFF"
knob cx=1000 cy=500 r=40 label="PITCH BEND" key=pitch_bend_range
knob cx=1160 cy=500 r=40 label="VELOCITY" key=velocity_track
qlinks "MAIN" = category,folder_name,preset,patch_name,author,volume,polyphony,legato,portamento,portamento_type,pitch_bend_range,velocity_track

