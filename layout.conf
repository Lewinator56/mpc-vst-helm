# Helm VST - Authentic MPC Touch UI Layout
# Complete 9-page layout matching Helm with dynamic waveform diagrams, ADSR envelopes, filter curve, and 8-slot Mod Matrix.

[tab MAIN]
frame x=10 y=92 w=1258 h=240 title="PRESET BROWSER"
stepper cx=230 cy=212 w=380 h=54 label="CATEGORY" key=category get=folder_name
